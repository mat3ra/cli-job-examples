# outdir and prefix match q3_scf.yml: this run reads the effective potential saved by the SCF run
material: material.json
model:
  type: dft
  subtype: gga
  functional: pbe
method:
  type: pseudopotential
  subtype: ultrasoft
  cutoffs:
    wavefunction: 40.0
    density: 200.0
  pseudopotentials:
    Si: /export/share/pseudo/si/gga/pbe/gbrv/1.0/us/si_pbe_gbrv_1.0.upf
  scf:
    number_of_bands: 16
control:
  # a non-self-consistent run; `calculation: bands` would mean the multi-step band_structure
  # workflow, which the q3 binary refuses
  calculation: nscf
  outdir: ./output
  prefix: si_bands_us
  # the q3 binary does not generate k-points from band_path, so kpoints_list spells out the path;
  # band_path tells the solver where the segments of kpoints_list start, so that it does not carry
  # wavefunctions across a change of path direction
  band_path: ["G", "X", "W", "K", "G", "L"]
  band_path_points_per_segment: 20
  # [kx, ky, kz, weight] in crystal coordinates of the FCC primitive cell
  kpoints_list:
    - [0.000000, 0.000000, 0.000000, 1.0]  # G
    - [0.025000, 0.000000, 0.025000, 1.0]
    - [0.050000, 0.000000, 0.050000, 1.0]
    - [0.075000, 0.000000, 0.075000, 1.0]
